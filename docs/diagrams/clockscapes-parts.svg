        <title id="clockscapes-parts-title">How the parts of Clockscapes fit</title>
        <desc id="clockscapes-parts-desc">Opening index.html registers an offline copy, saves settings in IndexedDB, asks Open-Meteo for weather every ten minutes, makes one clock column per city and plays the lofi music script.</desc>
