# Builds the Android test APKs (app, live wallpaper and Android Auto; "weather" is the real one, "navtest" a test build that installs beside it) from the android/ folder.
# It runs on every push to main, since the app ships the same index.html as the website.
# Download it from the run's page on GitHub: Actions -> Android APK -> the run -> Artifacts.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # the native music engine (native/lofi.c) is built with the NDK; keep this the ndkVersion in android/app/build.gradle.kts
      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
      - name: Build the APK
        run: gradle -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: clockscapes-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
