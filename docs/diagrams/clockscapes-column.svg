<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clockscapes-column-title clockscapes-column-desc" id="clockscapes-column-root">
        <title id="clockscapes-column-title">How a single clock is drawn</title>
        <desc id="clockscapes-column-desc">A Column is created, resize picks the layout and pixel size, build draws the still sky and city, and frame draws the moving layers fifteen times a second, calling build again each new minute or new weather.</desc>
        <defs>
      <style>#clockscapes-column-root { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8ecf1; }
      #clockscapes-column-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#clockscapes-column-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="clockscapes-column-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a94a3"/></marker>
<marker id="clockscapes-column-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3aa8d8"/></marker>
<marker id="clockscapes-column-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a3b8f0"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#0d0f12"/>
